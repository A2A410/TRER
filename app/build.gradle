buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'xeq.trer.html'
    compileSdkVersion 33
    buildToolsVersion "33.0.2"

    defaultConfig {
        applicationId "xeq.trer.html"
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            manifestPlaceholders = [appName: "TRER D"]
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [appName: "TRER"]
        }
        beta {
            initWith release
            applicationIdSuffix ".beta"
            manifestPlaceholders = [appName: "TRER B"]
            matchingFallbacks = ['release']
        }
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.8.3'
    implementation 'com.google.code.gson:gson:2.8.2'
}
