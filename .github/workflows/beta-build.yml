name: Build Beta APK

on:
  push:
    branches:
      - beta-direct-fetch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Beta APK
        run: ./gradlew assembleBeta

      - name: Upload Beta APK
        uses: actions/upload-artifact@v3
        with:
          name: TRER-Beta-APK
          path: app/build/outputs/apk/beta/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: beta-${{ github.run_number }}
          name: Beta Build v${{ github.run_number }}
          draft: false
          prerelease: true
          files: app/build/outputs/apk/beta/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
